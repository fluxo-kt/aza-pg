name: "Set up Nix"
description: "Install Nix and restore the store from the Actions cache, so a build compiles only what changed"
author: "fluxo-kt"

# The image's own derivations (PostgreSQL with our flags, every extension) are in no public binary cache, and
# compiling them takes far longer than restoring them. The key covers every build input the flake reads, so a hit
# holds this exact build; on a miss the nearest older store is restored and only changed derivations rebuild.
# One cache per runner architecture, shared by ci.yml and publish.yml, which build the same derivations.
#
# Every job running a script that reaches scripts/nix/nix.ts needs this action: without Nix, nix.ts would use its Mac
# fallback, a nixos/nix container starting from an empty store each run, and refuses to under CI=true. A job that
# only runs the checkers (scripts/nix/tools.ts) sets restore-store: "false": its tools are in cache.nixos.org, so
# restoring the image's multi-GB store costs more than fetching them.
inputs:
  restore-store:
    description: "Restore the Nix store cache (needed only by jobs that build the image)"
    default: "true"

runs:
  using: "composite"
  steps:
    - name: Install Nix
      uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31.11.5
      with:
        extra_nix_config: |
          experimental-features = nix-command flakes
          keep-outputs = true

    - name: Restore the Nix store
      if: inputs.restore-store == 'true'
      uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7.0.2
      with:
        # Nix 2.35 rejects some output checks when only some sibling outputs are restored. Isolate the
        # existing partial stores without disabling checks or deleting caches. See NixOS/nix#16485.
        primary-key: nix-store-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.lock', 'flake.nix', 'nix/**', 'docker/postgres/**', 'scripts/extensions/manifest-data.ts') }}
        restore-prefixes-first-match: nix-store-v2-${{ runner.os }}-${{ runner.arch }}-
        # Bounds the saved store: build-only paths of older runs go first, so the cache stays within the repo quota.
        gc-max-store-size-linux: 6G
