name: Junie Review

on:
  pull_request:
    types: [opened, reopened]
    # types: [opened, reopened, synchronize]

env:
  CI: true
  BUILD_NUMBER: ${{ github.run_number }}
  SCM_TAG: ${{ github.sha }}
  IS_DEFAULT_BRANCH: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}

jobs:
  junie-review:
    # Optional: Filter by PR author
    # if: |
    #   github.event.pull_request.user.login == 'external-contributor' ||
    #   github.event.pull_request.user.login == 'new-developer' ||
    #   github.event.pull_request.author_association == 'FIRST_TIME_CONTRIBUTOR' ||
    #   github.event.pull_request.author_association == 'FIRST_TIMER'

    runs-on: ubuntu-latest
    timeout-minutes: 23
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read # Required for Claude to read CI results on PRs
      security-events: read
      checks: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 30 # Longer history for better diff analysis

      # https://junie.jetbrains.com/docs/junie-on-github.html#setup
      # https://github.com/JetBrains/junie-github-action/blob/main/COOKBOOK.md#setup
      # https://github.com/JetBrains/junie-github-action/blob/main/action.yml
      - name: Run Junie Review
        id: junie-review
        uses: JetBrains/junie-github-action@112ad4d86f7c26d658048ae764b01b39d8427819 # v1.7.16
        with:
          junie_api_key: ${{ secrets.JUNIE_API_KEY }}
          # Alternatively, write your custom review instructions in the prompt field
          # instead of using the built-in "code-review" value
          prompt: "code-review"
          # Update the same comment on subsequent Junie runs instead of adding new comments
          # use_single_comment: "true"
