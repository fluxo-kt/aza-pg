name: Check Extension Updates

on:
  schedule:
    - cron: "0 9 * * MON" # Weekly on Monday 9am UTC
  workflow_dispatch:

permissions:
  issues: write
  contents: read

jobs:
  check-updates:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Bun and dependencies
        uses: ./.github/actions/setup-bun

      # No continue-on-error: a broken check must turn this job red, so the report step says "check failed" instead
      # of reading an empty result as "up to date".
      - name: Check for extension updates
        run: |
          set -euo pipefail
          # check-updates.ts exits 1 when enabled updates exist, and a crash also exits 1, so the
          # status cannot be trusted; the result is the JSON array it prints last. `jq -e` fails on
          # empty or truncated output, which is what a crash leaves behind.
          bun scripts/extensions/check-updates.ts --format=json > updates.json || true
          jq -e 'if type == "array" and length > 0 then true else error("check-updates produced no result rows") end' updates.json > /dev/null

      # Vendor apt pins carry no git tag, so check-updates cannot see them. Exit 1 = a pin is gone or
      # outdated (reported in the issue); exit 2 = the probe failed, which must turn the job red.
      - name: Check Percona and Timescale pins
        run: |
          set -uo pipefail
          status=0
          bun scripts/extensions/check-vendor-apt.ts > vendor.txt 2>&1 || status=$?
          cat vendor.txt
          [ "$status" -ne 2 ] || exit 1

      # One open issue is the only place this weekly job reports anything, so it must say every outcome: the update
      # list, a failed check (a red scheduled job alone goes unseen, e.g. an install blocked by a new advisory), or
      # nothing pending (closed, so a stale list never reads as current).
      - name: Report in the tracking issue
        if: always()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          JOB_STATUS: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          script: |
            const fs = require('fs');
            const labels = ['dependencies', 'extensions', 'automated'];
            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: labels.join(','),
              per_page: 1
            });
            const date = new Date().toISOString().split('T')[0];
            const report = async (title, body) => {
              if (open.length > 0)
                await github.rest.issues.update({ owner: context.repo.owner, repo: context.repo.repo, issue_number: open[0].number, title, body });
              else
                await github.rest.issues.create({ owner: context.repo.owner, repo: context.repo.repo, title, body, labels });
            };

            if (process.env.JOB_STATUS !== 'success') {
              await report(
                `❌ Dependency check failed - ${date}`,
                `The weekly dependency check did not finish, so updates are unknown: ${process.env.RUN_URL}\n\n` +
                  `Fix the failing step (run \`bun scripts/extensions/check-updates.ts\` and \`bun scripts/extensions/check-vendor-apt.ts\` locally), then re-run the workflow.`
              );
              return;
            }
            const updates = JSON.parse(fs.readFileSync('updates.json', 'utf8'));

            const withUpdates = updates.filter(u => u.updateAvailable && u.enabled);
            // Rows whose upstream lookup failed carry latest === null; they need a manual look.
            const unchecked = updates.filter(u => u.enabled && u.latest === null);

            const updatesList = withUpdates.map(u =>
              `### ${u.name}\n` +
              `- **Current**: \`${u.current}\`\n` +
              `- **Latest**: \`${u.latest}\`\n` +
              `- **Source**: ${u.source}\n` +
              `- **Notes**: ${u.notes}\n` +
              (u.releaseUrl ? `- [View Release](${u.releaseUrl})\n` : '')
            ).join('\n');

            const vendorProblems = fs.readFileSync('vendor.txt', 'utf8')
              .split('\n').filter(l => l.startsWith('❌')).join('\n');

            const uncheckedList = unchecked.map(u =>
              `- **${u.name}**: \`${u.current}\` — ${u.notes}\n` +
              `  - Source: ${u.source}`
            ).join('\n');

            const body =
              `## 🔄 Extension Updates Available\n\n` +
              `Found **${withUpdates.length}** extension(s) with newer versions:\n\n` +
              `${updatesList}\n\n` +
              (unchecked.length
                ? `## ⚠️ Could Not Check\n\nThe upstream lookup failed for these; check them manually:\n\n${uncheckedList}\n\n`
                : '') +
              (vendorProblems
                ? `## 📦 Percona / Timescale Pins\n\n\`bun scripts/extensions/check-vendor-apt.ts\`:\n\n\`\`\`\n${vendorProblems}\n\`\`\`\n\n`
                : '') +
              `---\n\n` +
              `### Update Instructions\n\n` +
              `1. Review each update above for compatibility and breaking changes\n` +
              `2. Update versions in \`scripts/extensions/manifest-data.ts\`; for a container image, in the files its Notes name (\`.claude/commands/update.md\` Phase 5.6)\n` +
              `3. Run \`bun run generate\` to regenerate manifests\n` +
              `4. Run \`bun run validate\` to verify changes\n` +
              `5. Test locally if critical extensions\n` +
              `6. Commit and push changes\n\n` +
              `---\n\n` +
              `*Automated check run: ${new Date().toISOString()}*`;

            const total = withUpdates.length + (vendorProblems ? vendorProblems.split('\n').length : 0);
            if (total > 0) {
              await report(`📦 ${total} dependency update(s) available - ${date}`, body);
            } else if (open.length > 0) {
              await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: open[0].number, body: `All dependencies are current (${process.env.RUN_URL}).` });
              await github.rest.issues.update({ owner: context.repo.owner, repo: context.repo.repo, issue_number: open[0].number, state: 'closed' });
            }
