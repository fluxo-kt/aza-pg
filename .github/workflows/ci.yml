# ============================================================================
# Comprehensive CI Pipeline
# ============================================================================
#
# PURPOSE:
# --------
# Comprehensive test suite for all PRs and commits to main/dev branches.
# Validates code quality, builds Docker image, and runs extensive test suite.
#
# PIPELINE STRUCTURE:
# ------------------
# 1. lint-workflows - Workflow syntax/expression validation
# 2. validate       - Fast validation, unit tests, manifest checks
# 3. build          - Build Docker image, export as artifact
# 4. test           - One job per suite group of scripts/test-all.ts (the only list of Docker suites)
# 5. ci-complete    - Final gate, summary
#
# PARALLELIZATION:
# ---------------
# - validate runs first (fast checks)
# - build depends on validate
# - test-* jobs run in parallel after build completes
# - ci-complete waits for all tests
#
# DOCKER IMAGE SHARING:
# --------------------
# - build job exports image as tarball artifact
# - test jobs download and load image from artifact
# - Uses actions/upload-artifact@v7 and actions/download-artifact@v8 (via load-test-image action)
#
# DIFFERENCES FROM build-postgres-image.yml:
# -----------------------------------------
# - Automatic on PR/push (not manual)
# - Single-platform amd64 only (not multi-arch)
# - No registry push (artifact-based sharing)
# - More comprehensive test coverage
# - Faster feedback (parallel tests)
#
# ============================================================================

name: CI

on:
  push:
    branches:
      - main
      - dev
      - release
  pull_request:
    branches:
      - "**"

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ==========================================================================
  # Job 1: Lint workflows (fail fast on invalid GitHub Actions expressions)
  # Note: local action metadata is validated in validate:all via validate-local-actions.ts
  # ==========================================================================
  lint-workflows:
    name: Lint Workflows
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Bun and dependencies
        uses: ./.github/actions/setup-bun

      # Same check `bun run validate:all` runs (Workflow Expressions), so the pin cannot drift.
      - name: Lint workflows (actionlint + shellcheck)
        run: bun scripts/ci/lint-workflows.ts

  # ==========================================================================
  # Job 2: Validate (fast checks + unit tests)
  # ==========================================================================
  validate:
    name: Validate & Unit Tests
    runs-on: ubuntu-latest
    needs: lint-workflows
    timeout-minutes: 10
    # Skip pull_request events from dev branch (push trigger already handles dev)
    if: github.event_name != 'pull_request' || github.head_ref != 'dev'

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Bun and dependencies
        uses: ./.github/actions/setup-bun

      - name: Run full validation
        run: bun run validate:all
        env:
          CI: "true"

      - name: Validate pinned base image digest is resolvable
        run: bun scripts/validate-base-image-sha.ts --check --require-latest-minor

      - name: Repository health check
        run: bun scripts/ci/repository-health-check.ts

      - name: Generate job summary
        if: always()
        run: |
          set -euo pipefail
          {
            echo "### Validation Summary :white_check_mark:"
            echo ""
            echo "**Branch:** \`${{ github.ref_name }}\`"
            echo "**Commit:** \`${{ github.sha }}\`"
            echo ""
            echo "**Checks performed:**"
            echo "- ✅ Full validation (lint, formatting, type-checking, docs links, shell/yaml/docker checks)"
            echo "- ✅ Base image digest resolvability check"
            echo "- ✅ Unit tests (auto-config, utils)"
            echo "- ✅ Manifest validation"
            echo "- ✅ Generated files sync (Dockerfile, configs, docs)"
            echo "- ✅ Repository health check"
          } >> "$GITHUB_STEP_SUMMARY"

  # ==========================================================================
  # Job 2: Build (Docker image, export as artifact)
  # ==========================================================================
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: validate
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Bun and dependencies
        uses: ./.github/actions/setup-bun

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build Docker image with layer caching
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./docker/postgres/Dockerfile
          tags: aza-pg-ci:test
          platforms: linux/amd64
          load: true
          build-args: |
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
            VCS_REF=${{ github.sha }}
          cache-from: type=gha,scope=aza-pg-ci
          cache-to: type=gha,mode=max,scope=aza-pg-ci
          sbom: false
          provenance: false

      - name: Set up Bun (for cache monitoring)
        if: always()
        uses: ./.github/actions/setup-bun

      - name: Monitor cache usage
        if: always()
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          bun scripts/ci/monitor-cache-usage.ts \
            --repository ${{ github.repository }} \
            --platform "linux/amd64" \
            --github-summary

      - name: Verify image built successfully
        run: |
          set -euo pipefail
          echo "Verifying image exists..."
          docker images | grep aza-pg-ci

          echo "Testing basic functionality..."
          docker run --rm aza-pg-ci:test psql --version

          echo "Checking extension count..."
          # Derive expected count dynamically from manifest
          eval "$(bun scripts/derive-catalog-stats.ts --format=shell)"
          EXPECTED_MIN=$((CATALOG_EXTENSIONS + CATALOG_BUILTINS))

          EXTENSION_COUNT=$(docker run --rm aza-pg-ci:test \
            sh -c 'ls -1 /usr/share/postgresql/18/extension/*.control 2>/dev/null' | wc -l)
          echo "Found $EXTENSION_COUNT extension control files (expected: ${EXPECTED_MIN} = ${CATALOG_EXTENSIONS} ext + ${CATALOG_BUILTINS} builtin)"

          if [ "$EXTENSION_COUNT" -lt "$EXPECTED_MIN" ]; then
            echo "::error::Expected at least ${EXPECTED_MIN} extensions, found $EXTENSION_COUNT"
            exit 1
          fi

          echo "✅ Image verification passed"

      - name: Export image as tarball
        run: |
          set -euo pipefail
          echo "Exporting image to tarball..."
          docker save aza-pg-ci:test | gzip > /tmp/aza-pg-ci-image.tar.gz
          ls -lh /tmp/aza-pg-ci-image.tar.gz

      - name: Upload image artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docker-image
          path: /tmp/aza-pg-ci-image.tar.gz
          retention-days: 1
          compression-level: 0 # Already compressed with gzip

      - name: Generate build summary
        if: always()
        run: |
          set -euo pipefail
          {
            echo "### Build Summary :package:"
            echo ""
            echo "**Image:** \`aza-pg-ci:test\`"
            echo "**Platform:** linux/amd64"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          # Get image size
          IMAGE_SIZE=$(docker images aza-pg-ci:test --format "{{.Size}}")
          echo "**Image Size:** $IMAGE_SIZE" >> "$GITHUB_STEP_SUMMARY"

          # Get artifact size
          ARTIFACT_SIZE=$(du -h /tmp/aza-pg-ci-image.tar.gz | cut -f1)
          echo "**Artifact Size:** $ARTIFACT_SIZE (compressed)" >> "$GITHUB_STEP_SUMMARY"

  # ==========================================================================
  # Job 3: Test (one job per suite group; scripts/test-all.ts owns which suites a group holds)
  # ==========================================================================
  test:
    name: Test ${{ matrix.group }}
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: extensions
            timeout: 20
          - group: security
            timeout: 10
          - group: stacks
            timeout: 15
          - group: features
            timeout: 20
          - group: regression
            timeout: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up test environment
        uses: ./.github/actions/test-job-setup
        with:
          ghcr-login: "false"
          image-source: artifact
          image-name: aza-pg-ci:test

      - name: Run ${{ matrix.group }} suites
        run: bun scripts/test-all.ts --group "${{ matrix.group }}" --image aza-pg-ci:test

      - name: Capture test diagnostics
        uses: ./.github/actions/capture-test-diagnostics
        with:
          test-type: ${{ matrix.group }}

  # ==========================================================================
  # Job 4: CI Complete (final gate)
  # ==========================================================================
  ci-complete:
    name: CI Complete
    runs-on: ubuntu-latest
    needs: [validate, build, test]
    timeout-minutes: 1
    # Skip if validate was skipped (intentional skip for PR from dev branch)
    if: always() && needs.validate.result != 'skipped'

    steps:
      - name: Check all jobs status
        env:
          VALIDATE: ${{ needs.validate.result }}
          BUILD: ${{ needs.build.result }}
          TEST: ${{ needs.test.result }}
        run: |
          set -euo pipefail
          {
            echo "# CI Pipeline"
            echo ""
            echo "| Job | Result |"
            echo "|-----|--------|"
            echo "| Validate | $VALIDATE |"
            echo "| Build | $BUILD |"
            echo "| Test (all groups) | $TEST |"
          } >> "$GITHUB_STEP_SUMMARY"
          # A failed or cancelled job fails the gate; skipped jobs do not.
          for result in "$VALIDATE" "$BUILD" "$TEST"; do
            case "$result" in
              failure | cancelled)
                echo "::error::A CI job ended with: $result"
                exit 1
                ;;
            esac
          done
          echo "✅ All CI checks passed!"
