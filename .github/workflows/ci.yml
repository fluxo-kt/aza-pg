# ============================================================================
# Comprehensive CI Pipeline
# ============================================================================
#
# PURPOSE:
# --------
# Comprehensive test suite for all PRs and commits to main/dev branches.
# Validates code quality, builds Docker image, and runs extensive test suite.
#
# PIPELINE STRUCTURE:
# ------------------
# 1. lint-workflows - Workflow syntax/expression validation
# 2. validate       - Fast validation, unit tests, manifest checks
# 3. build          - Build Docker image, export as artifact
# 4. test           - One job per suite group of scripts/test-all.ts (the only list of Docker suites)
# 5. ci-complete    - Final gate, summary
#
# PARALLELIZATION:
# ---------------
# - validate runs first (fast checks)
# - build depends on validate
# - test-* jobs run in parallel after build completes
# - ci-complete waits for all tests
#
# DOCKER IMAGE SHARING:
# --------------------
# - build job keys the image by its inputs (scripts/ci/image-input-hash.ts) and builds + saves the tarball to
#   actions/cache only when no entry has that key, so a commit that changes no image input reuses the image
# - test jobs restore the tarball by the same key (via load-test-image, source: cache)
#
# DIFFERENCES FROM build-postgres-image.yml:
# -----------------------------------------
# - Automatic on PR/push (not manual)
# - Single-platform amd64 only (not multi-arch)
# - No registry push (actions/cache-based sharing)
# - More comprehensive test coverage
# - Faster feedback (parallel tests)
#
# ============================================================================

name: CI

on:
  push:
    branches:
      - main
      - dev
      - release
  pull_request:
    branches:
      - "**"

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

# Each timeout-minutes is 4–8x the job's measured run time on ubuntu-latest: it exists to stop a hang early, never to
# decide that work is done. The build is sized on a full rebuild of the source-built extensions (about 20 min), not on
# a cache hit: a timeout that kills that rebuild never saves its layer cache, so every later run would start cold and
# fail the same way. Re-measure (gh run view <id> --json jobs) when a job's duration moves.
jobs:
  # ==========================================================================
  # Job 1: Lint workflows (fail fast on invalid GitHub Actions expressions)
  # Note: local action metadata is validated in validate:all via validate-local-actions.ts
  # ==========================================================================
  lint-workflows:
    name: Lint Workflows
    runs-on: ubuntu-latest
    timeout-minutes: 1

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Bun and dependencies
        uses: ./.github/actions/setup-bun

      # Same check `bun run validate:all` runs (Workflow Expressions), so the pin cannot drift.
      - name: Lint workflows (actionlint + shellcheck)
        run: bun scripts/ci/lint-workflows.ts

  # ==========================================================================
  # Job 2: Validate (fast checks + unit tests)
  # ==========================================================================
  validate:
    name: Validate & Unit Tests
    runs-on: ubuntu-latest
    needs: lint-workflows
    timeout-minutes: 3
    # Skip pull_request events from dev branch (push trigger already handles dev)
    if: github.event_name != 'pull_request' || github.head_ref != 'dev'

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Bun and dependencies
        uses: ./.github/actions/setup-bun

      - name: Run full validation
        run: bun run validate:all
        env:
          CI: "true"

      - name: Validate pinned base image digest is resolvable
        run: bun scripts/validate-base-image-sha.ts --check --require-latest-minor

      - name: Repository health check
        run: bun scripts/ci/repository-health-check.ts

      - name: Generate job summary
        if: always()
        run: |
          set -euo pipefail
          {
            echo "### Validation Summary :white_check_mark:"
            echo ""
            echo "**Branch:** \`${{ github.ref_name }}\`"
            echo "**Commit:** \`${{ github.sha }}\`"
            echo ""
            echo "**Checks performed:**"
            echo "- ✅ Full validation (lint, formatting, type-checking, docs links, shell/yaml/docker checks)"
            echo "- ✅ Base image digest resolvability check"
            echo "- ✅ Unit tests (auto-config, utils)"
            echo "- ✅ Manifest validation"
            echo "- ✅ Generated files sync (Dockerfile, configs, docs)"
            echo "- ✅ Repository health check"
          } >> "$GITHUB_STEP_SUMMARY"

  # ==========================================================================
  # Job 2: Build (only when no cached image has this commit's image-input key)
  # ==========================================================================
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: validate
    timeout-minutes: 100
    outputs:
      image-key: ${{ steps.key.outputs.key }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Bun and dependencies
        uses: ./.github/actions/setup-bun

      - name: Compute image input key
        id: key
        run: |
          set -euo pipefail
          key=$(bun scripts/ci/image-input-hash.ts)
          echo "key=$key" >> "$GITHUB_OUTPUT"

      # lookup-only: on a hit the test jobs restore the tarball; this job needs only to know it exists.
      - name: Look up cached image
        id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/aza-pg-ci-image.tar.gz
          key: ${{ steps.key.outputs.key }}
          lookup-only: true

      - name: Set up Docker Buildx
        if: steps.cache.outputs.cache-hit != 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # A reused image keeps the VCS_REF label of the commit that built it; nothing in CI reads that label.
      - name: Build Docker image with layer caching
        if: steps.cache.outputs.cache-hit != 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./docker/postgres/Dockerfile
          tags: aza-pg-ci:test
          platforms: linux/amd64
          load: true
          build-args: |
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
            VCS_REF=${{ github.sha }}
          cache-from: type=gha,scope=aza-pg-ci
          cache-to: type=gha,mode=max,scope=aza-pg-ci
          sbom: false
          provenance: false

      - name: Monitor cache usage
        if: steps.cache.outputs.cache-hit != 'true'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          bun scripts/ci/monitor-cache-usage.ts \
            --repository ${{ github.repository }} \
            --platform "linux/amd64" \
            --github-summary

      - name: Export image as tarball
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          docker save aza-pg-ci:test | gzip > /tmp/aza-pg-ci-image.tar.gz
          ls -lh /tmp/aza-pg-ci-image.tar.gz

      - name: Save image to cache
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/aza-pg-ci-image.tar.gz
          key: ${{ steps.key.outputs.key }}

  # ==========================================================================
  # Job 3: Test (one job per suite group; scripts/test-all.ts owns which suites a group holds)
  # ==========================================================================
  test:
    name: Test ${{ matrix.group }}
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: extensions
            timeout: 8
          - group: security
            timeout: 4
          - group: stacks
            timeout: 5
          - group: features
            timeout: 7
          - group: regression
            timeout: 4

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up test environment
        uses: ./.github/actions/test-job-setup
        with:
          ghcr-login: "false"
          image-source: cache
          cache-key: ${{ needs.build.outputs.image-key }}
          image-name: aza-pg-ci:test

      - name: Run ${{ matrix.group }} suites
        run: bun scripts/test-all.ts --group "${{ matrix.group }}" --image aza-pg-ci:test

      - name: Capture test diagnostics
        # Without it the step inherits success() and is skipped after the failed suite it exists for
        if: failure()
        uses: ./.github/actions/capture-test-diagnostics
        with:
          test-type: ${{ matrix.group }}

  # ==========================================================================
  # Job 4: CI Complete (final gate)
  # ==========================================================================
  ci-complete:
    name: CI Complete
    runs-on: ubuntu-latest
    needs: [validate, build, test]
    timeout-minutes: 1
    # Skip if validate was skipped (intentional skip for PR from dev branch)
    if: always() && needs.validate.result != 'skipped'

    steps:
      - name: Check all jobs status
        env:
          VALIDATE: ${{ needs.validate.result }}
          BUILD: ${{ needs.build.result }}
          TEST: ${{ needs.test.result }}
        run: |
          set -euo pipefail
          {
            echo "# CI Pipeline"
            echo ""
            echo "| Job | Result |"
            echo "|-----|--------|"
            echo "| Validate | $VALIDATE |"
            echo "| Build | $BUILD |"
            echo "| Test (all groups) | $TEST |"
          } >> "$GITHUB_STEP_SUMMARY"
          # A failed or cancelled job fails the gate; skipped jobs do not.
          for result in "$VALIDATE" "$BUILD" "$TEST"; do
            case "$result" in
              failure | cancelled)
                echo "::error::A CI job ended with: $result"
                exit 1
                ;;
            esac
          done
          echo "✅ All CI checks passed!"
