# ============================================================================
# Comprehensive CI Pipeline
# ============================================================================
#
# PURPOSE:
# --------
# Comprehensive test suite for all PRs and pushes to main/dev/release.
# Validates code quality, builds Docker image, and runs extensive test suite.
#
# PIPELINE STRUCTURE:
# ------------------
# 1. lint-workflows - Workflow syntax/expression validation
# 2. validate       - bun run validate:all (static checks, unit tests, shell/YAML/Dockerfile lint), repo health
# 3. build          - Build the image unless actions/cache already holds one with its image-input key
# 4. test           - One job per suite group of scripts/test-all.ts (the only list of Docker suites)
# 5. ci-complete    - Final gate, summary
#
# PARALLELIZATION:
# ---------------
# - lint-workflows runs first, then validate
# - build depends on validate
# - test-* jobs run in parallel after build completes
# - ci-complete waits for all tests
#
# DOCKER IMAGE SHARING:
# --------------------
# - build job keys the image by the files the flake reads (flake.lock pins nixpkgs, so they are every input) and
#   builds + saves the tarball to actions/cache only when no entry has that key, so a commit that changes no image
#   input reuses the image
# - test jobs restore the tarball by the same key (via load-test-image, source: cache)
#
# Single-platform amd64 with no registry push; publish.yml builds and tests both platforms before each release.
#
# ============================================================================

name: CI

on:
  push:
    branches:
      - main
      - dev
      - release
  pull_request:
    branches:
      - "**"

# The event is part of the group: a push to dev and a PR whose head is dev share the branch name, and would cancel
# each other's run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

# Each timeout-minutes is 4–8x the job's measured run time on the hosted x64 runner: it exists to stop a hang early, never to
# decide that work is done. The build is sized on a full rebuild of the source-built extensions (about 20 min), not on
# a cache hit: a timeout that kills that rebuild never saves its layer cache, so every later run would start cold and
# fail the same way. A test job must also outlive a hung suite: setup, the suites queued before it, test-all's own
# kill (SUITE_TIMEOUT_MS, 3 min), its log read and its 30 s sweep; otherwise GitHub cancels the job before test-all
# names the hung suite. That floor (about 4.5 min) puts the fastest group, regression, at 8x rather than below it.
# Re-measure (gh run view <id> --json jobs) when a job's duration moves.
jobs:
  # ==========================================================================
  # Job 1: Lint workflows (fail fast on invalid GitHub Actions expressions)
  # Note: local action metadata is validated in validate:all via validate-local-actions.ts
  # ==========================================================================
  lint-workflows:
    name: Lint Workflows
    runs-on: ubuntu-26.04
    timeout-minutes: 2

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Bun and dependencies
        uses: ./.github/actions/setup-bun

      # Same check `bun run validate:all` runs (Workflow Expressions), so the pin cannot drift.
      - name: Lint workflows (actionlint + shellcheck)
        run: bun scripts/ci/lint-workflows.ts

  # ==========================================================================
  # Job 2: Validate (fast checks + unit tests)
  # ==========================================================================
  validate:
    name: Validate & Unit Tests
    runs-on: ubuntu-26.04
    needs: lint-workflows
    timeout-minutes: 3
    # Skip pull_request events from dev branch (push trigger already handles dev)
    if: github.event_name != 'pull_request' || github.head_ref != 'dev'

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Bun and dependencies
        uses: ./.github/actions/setup-bun

      - name: Run full validation
        run: bun run validate:all
        env:
          CI: "true"

      - name: Repository health check
        run: bun scripts/ci/repository-health-check.ts

  # ==========================================================================
  # Job 2: Build (only when no cached image has this commit's image-input key)
  # ==========================================================================
  build:
    name: Build Docker Image
    runs-on: ubuntu-26.04
    needs: validate
    timeout-minutes: 100
    outputs:
      image-key: ${{ steps.key.outputs.key }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Bun and dependencies
        uses: ./.github/actions/setup-bun

      # The same file set as setup-nix's store key: what the flake reads, nixpkgs included through flake.lock.
      - name: Compute image input key
        id: key
        run: echo "key=ci-image-nix-${{ hashFiles('flake.lock', 'flake.nix', 'nix/**', 'docker/postgres/**', 'scripts/extensions/manifest-data.ts') }}" >> "$GITHUB_OUTPUT"

      # lookup-only: on a hit the test jobs restore the tarball; this job needs only to know it exists.
      - name: Look up cached image
        id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/aza-pg-ci-image.tar.gz
          key: ${{ steps.key.outputs.key }}
          lookup-only: true

      - name: Set up Nix
        if: steps.cache.outputs.cache-hit != 'true'
        uses: ./.github/actions/setup-nix

      # A reused image keeps the revision label of the commit that built it; nothing in CI reads that label.
      - name: Build the Nix image
        if: steps.cache.outputs.cache-hit != 'true'
        run: bun scripts/nix/build-image.ts --tag aza-pg-ci:test

      - name: Monitor cache usage
        if: steps.cache.outputs.cache-hit != 'true'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          bun scripts/ci/monitor-cache-usage.ts \
            --repository ${{ github.repository }} \
            --platform "linux/amd64" \
            --github-summary

      - name: Export image as tarball
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          docker save aza-pg-ci:test | gzip > /tmp/aza-pg-ci-image.tar.gz
          ls -lh /tmp/aza-pg-ci-image.tar.gz

      - name: Save image to cache
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/aza-pg-ci-image.tar.gz
          key: ${{ steps.key.outputs.key }}

  # ==========================================================================
  # Job 3: Test (one job per suite group; scripts/test-all.ts owns which suites a group holds)
  # ==========================================================================
  test:
    name: Test ${{ matrix.group }}
    runs-on: ubuntu-26.04
    needs: build
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: extensions
            timeout: 6
          - group: security
            timeout: 5
          - group: stacks
            timeout: 7
          - group: features
            timeout: 6
          - group: regression
            timeout: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up test environment
        uses: ./.github/actions/test-job-setup
        with:
          ghcr-login: "false"
          image-source: cache
          cache-key: ${{ needs.build.outputs.image-key }}
          image-name: aza-pg-ci:test

      - name: Run ${{ matrix.group }} suites
        run: bun scripts/test-all.ts --group "${{ matrix.group }}" --image aza-pg-ci:test

  # ==========================================================================
  # Job 4: CI Complete (final gate)
  # ==========================================================================
  ci-complete:
    name: CI Complete
    runs-on: ubuntu-26.04
    needs: [lint-workflows, validate, build, test]
    timeout-minutes: 1
    # Skipped only where validate is skipped on purpose (a PR from dev; the push run checks dev). Keying on the event,
    # not on validate's result, keeps the gate running when a failed lint-workflows is what skipped validate.
    if: always() && !(github.event_name == 'pull_request' && github.head_ref == 'dev')

    steps:
      - name: Check all jobs status
        env:
          LINT_WORKFLOWS: ${{ needs.lint-workflows.result }}
          VALIDATE: ${{ needs.validate.result }}
          BUILD: ${{ needs.build.result }}
          TEST: ${{ needs.test.result }}
        run: |
          set -euo pipefail
          {
            echo "# CI Pipeline"
            echo ""
            echo "| Job | Result |"
            echo "|-----|--------|"
            echo "| Lint Workflows | $LINT_WORKFLOWS |"
            echo "| Validate | $VALIDATE |"
            echo "| Build | $BUILD |"
            echo "| Test (all groups) | $TEST |"
          } >> "$GITHUB_STEP_SUMMARY"
          # A failed or cancelled job fails the gate; skipped jobs do not.
          for result in "$LINT_WORKFLOWS" "$VALIDATE" "$BUILD" "$TEST"; do
            case "$result" in
              failure | cancelled)
                echo "::error::A CI job ended with: $result"
                exit 1
                ;;
            esac
          done
          echo "✅ All CI checks passed!"
