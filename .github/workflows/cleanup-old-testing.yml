name: Cleanup Old Testing Images

on:
  schedule:
    # Weekly on Sunday at 02:00 UTC
    - cron: "0 2 * * 0"

  workflow_dispatch:
    inputs:
      days:
        description: "Delete testing tags older than N days (default: 2, use 0 to delete ALL)"
        required: false
        default: "2"
        type: string
      keep_last:
        description: "Alternative: Keep only last N tags (overrides days if set)"
        required: false
        type: string
      dry_run:
        description: "Dry-run mode (preview only, no deletions)"
        required: false
        default: false
        type: boolean

permissions:
  packages: write
  contents: read

jobs:
  cleanup:
    name: Cleanup Old Testing Tags
    runs-on: ubuntu-26.04
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Bun and dependencies
        uses: ./.github/actions/setup-bun

      - name: Load workflow config
        id: config
        run: |
          set -euo pipefail
          echo "testing_image_name=$(jq -r '.organization + "/" + .testingImageName' .github/workflow-config.json)" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: bun install --frozen-lockfile
        env:
          BUN_CONFIG_INSTALL_MINIMUM_RELEASE_AGE: "86400" # 1 day delay for supply chain security
          # Omit acknowledged-CVE advisories so they don't cancel this non-TTY install (see setup-bun).
          BUN_OSV_SHOW_IGNORED: "0"

      # Dispatch inputs reach the shell only through env, so an input value can never run as shell code.
      - name: Cleanup old testing images
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DAYS: ${{ inputs.days }}
          KEEP_LAST: ${{ inputs.keep_last }}
          DRY_RUN_INPUT: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          DRY_RUN=""

          # Set dry-run flag
          if [ "$DRY_RUN_INPUT" = "true" ]; then
            DRY_RUN="--dry-run"
          fi

          # Build command based on retention policy
          if [ -n "$KEEP_LAST" ]; then
            # Count-based retention (overrides days)
            echo "Using count-based retention: keep last $KEEP_LAST tags"
            bun scripts/release/cleanup-testing-images.ts \
              --repository ${{ steps.config.outputs.testing_image_name }} \
              --keep-last "$KEEP_LAST" \
              --continue-on-error \
              $DRY_RUN
          else
            # Time-based retention (default: 2 days)
            DAYS="${DAYS:-2}"
            echo "Using time-based retention: delete tags older than $DAYS days"
            bun scripts/release/cleanup-testing-images.ts \
              --repository ${{ steps.config.outputs.testing_image_name }} \
              --older-than "$DAYS" \
              --continue-on-error \
              $DRY_RUN
          fi

      - name: Summary
        if: always()
        env:
          DAYS: ${{ inputs.days || '2' }}
          KEEP_LAST: ${{ inputs.keep_last }}
          DRY_RUN_INPUT: ${{ inputs.dry_run || 'false' }}
        run: |
          set -euo pipefail
          {
            echo "### Cleanup Summary"
            echo ""
            echo "- **Repository**: \`${{ steps.config.outputs.testing_image_name }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

          # Determine which policy was used
          if [ -n "$KEEP_LAST" ]; then
            echo "- **Retention Policy**: Count-based (keep last $KEEP_LAST tags)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- **Retention Policy**: Time-based (delete tags older than $DAYS days)" >> "$GITHUB_STEP_SUMMARY"
          fi

          {
            echo "- **Dry Run**: \`$DRY_RUN_INPUT\`"
            echo "- **Pattern**: \`*\` (all tags in testing repository)"
            echo ""
            echo "**Note**: This is an automated weekly cleanup to reduce storage costs."
            echo "Testing tags are ephemeral and only used during the build-test-promote cycle."
          } >> "$GITHUB_STEP_SUMMARY"
