# ============================================================================
# Nightly Regression Tests - Comprehensive Coverage
# ============================================================================
#
# PURPOSE:
# --------
# Runs the `nightly` suite group of scripts/test-all.ts (extension regression and interaction tests in
# regression mode) against the regression image: every extension, including ones disabled in the release image,
# and every optional preload library. It catches upstream breakage before an extension is enabled.
#
# The release image's own suites run on every push (ci.yml) and before every release (publish.yml); this
# workflow does not repeat them.
#
# WHEN IT RUNS:
# -------------
# 1. Scheduled: Weekly on Sunday at 2:00 AM UTC (cron: '0 2 * * 0')
# 2. Manual trigger (workflow_dispatch)
#
# ============================================================================

name: Nightly Regression Tests

on:
  schedule:
    # Weekly on Sunday at 2:00 AM UTC
    - cron: "0 2 * * 0"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

env:
  TEST_MODE: regression

# timeout-minutes: 4–8x each job's measured run time, builds sized on a full rebuild; reason in ci.yml above jobs:
jobs:
  # ==========================================================================
  # Job 1: Build the regression image (regression.Dockerfile: all extensions, pgTAP)
  # ==========================================================================
  build:
    name: Build Regression Image
    runs-on: ubuntu-latest
    timeout-minutes: 100

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver: docker-container
          driver-opts: network=host

      # Regression mode expects the regression image; the release Dockerfile lacks the disabled extensions it tests.
      - name: Build Docker image with layer caching
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./docker/postgres/regression.Dockerfile
          tags: aza-pg-regression:test
          load: true
          build-args: |
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
            VCS_REF=${{ github.sha }}
          cache-from: type=gha,scope=aza-pg-regression
          cache-to: type=gha,mode=max,scope=aza-pg-regression

      - name: Export image as tarball
        run: |
          set -euo pipefail
          docker save aza-pg-regression:test | gzip > /tmp/aza-pg-ci-image.tar.gz
          ls -lh /tmp/aza-pg-ci-image.tar.gz

      - name: Upload image artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: regression-image
          path: /tmp/aza-pg-ci-image.tar.gz
          retention-days: 1
          compression-level: 0 # Already compressed with gzip

  # ==========================================================================
  # Job 2: Run the nightly suite group
  # ==========================================================================
  test:
    name: Test nightly
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up test environment
        uses: ./.github/actions/test-job-setup
        with:
          image-source: artifact
          image-name: aza-pg-regression:test
          artifact-name: regression-image

      - name: Run nightly suites
        run: bun scripts/test-all.ts --group nightly --image aza-pg-regression:test
