# ============================================================================
# Regression Tests - on demand, against any image reference
# ============================================================================
#
# Runs the `regression` suite group of scripts/test-all.ts (each enabled extension's SQL against its expected
# output, and extension interactions, in production mode) against an image reference. publish.yml runs the same
# group in its release gate; this workflow checks an already published image.
#
# Usage: gh workflow run regression-tests.yml -f image_ref=ghcr.io/fluxo-kt/aza-pg:18-single-node
# ============================================================================

name: Regression Tests

on:
  workflow_dispatch:
    inputs:
      image_ref:
        description: "Full image reference to test (e.g., ghcr.io/fluxo-kt/aza-pg:18-single-node)"
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: read

# timeout-minutes: 4–8x each job's measured run time, builds sized on a full rebuild; reason in ci.yml above jobs:
jobs:
  test:
    name: Test regression
    runs-on: ubuntu-26.04
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up test environment
        uses: ./.github/actions/test-job-setup
        with:
          ghcr-login: "true"
          ghcr-token: ${{ secrets.GITHUB_TOKEN }}
          image-source: registry
          image-name: ${{ inputs.image_ref }}
          registry-image: ${{ inputs.image_ref }}

      - name: Run regression suites
        env:
          IMAGE_REF: ${{ inputs.image_ref }}
        run: bun scripts/test-all.ts --group regression --image "$IMAGE_REF"
