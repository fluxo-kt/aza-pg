services:
  # PostgreSQL 18 with aza-pg auto-configuration
  postgres:
    image: ${POSTGRES_IMAGE:-ghcr.io/fluxo-kt/aza-pg:18}
    container_name: postgres
    restart: unless-stopped
    environment:
      # The image uses POSTGRES_BIND_IP as listen_addresses (default 127.0.0.1). PostgreSQL must listen on the Docker
      # network or pgbouncer, the exporters and a phase2 replica cannot connect; host exposure stays 127.0.0.1 (ports).
      POSTGRES_BIND_IP: "0.0.0.0"
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD not set}
      POSTGRES_DB: ${POSTGRES_DB:-main}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_MEMORY: ${POSTGRES_MEMORY:-5120} # MB; the entrypoint refuses unit suffixes
      POSTGRES_WORKLOAD_TYPE: ${POSTGRES_WORKLOAD_TYPE:-web}
      POSTGRES_STORAGE_TYPE: ${POSTGRES_STORAGE_TYPE:-ssd}
      # Enable shared_preload_libraries (already configured in aza-pg)
      # Default: auto_explain,pg_cron,pg_net,pg_stat_monitor,pg_stat_statements,pgaudit,pgsodium,safeupdate,supabase_vault,timescaledb
    volumes:
      # PG18 keeps PGDATA at /var/lib/postgresql/18/docker; a .../data mount makes the entrypoint refuse to start
      - postgres_data:/var/lib/postgresql
      # Optional: mount custom postgresql.conf overrides
      # - ./postgres-custom.conf:/etc/postgresql/postgresql.conf:ro
    networks:
      - aza-pg-network
    ports:
      # Internal only - never expose publicly
      - "127.0.0.1:5432:5432"
    deploy:
      resources:
        limits:
          cpus: "3.0"
          memory: 5G
        reservations:
          cpus: "2.0"
          memory: 4G
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # PgBouncer - Connection Pooling
  pgbouncer:
    # edoburu's image, as in stacks/: PgBouncer 1.26.0 fixes unauthenticated remote crash/hang bugs (CVE-2026-19888,
    # CVE-2026-6668), and the official pgbouncer/pgbouncer image publishes nothing newer than 1.25.2.
    image: edoburu/pgbouncer:v1.26.0-p0@sha256:b17551c776ef7e5769ef80b956d20f85e2fd25dd8912d31d58f782aad495b711
    container_name: pgbouncer
    restart: unless-stopped
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-main}
      # No DB_PASSWORD: with one, the image appends a credential to userlist.txt, which is mounted read-only. Logins
      # to PostgreSQL reuse each client's SCRAM secret from userlist.txt.
      DB_USER: ${POSTGRES_USER:-postgres}
      LISTEN_PORT: 6432
      POOL_MODE: ${PGBOUNCER_POOL_MODE:-transaction}
      DEFAULT_POOL_SIZE: ${PGBOUNCER_DEFAULT_POOL_SIZE:-25}
      MAX_CLIENT_CONN: ${PGBOUNCER_MAX_CLIENT_CONN:-2000}
      AUTH_TYPE: scram-sha-256
      AUTH_FILE: /etc/pgbouncer/userlist.txt
      STATS_USERS: ${POSTGRES_USER:-postgres}
      IGNORE_STARTUP_PARAMETERS: extra_float_digits
      # For the healthcheck's psql only: PgBouncer authenticates every client with scram-sha-256
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD not set}
    volumes:
      - ./pgbouncer/userlist.txt:/etc/pgbouncer/userlist.txt:ro
    networks:
      - aza-pg-network
    ports:
      - "127.0.0.1:6432:6432"
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
    healthcheck:
      test:
        [
          "CMD",
          "psql",
          "-h",
          "localhost",
          "-p",
          "6432",
          "-U",
          "${POSTGRES_USER:-postgres}",
          "-d",
          "${POSTGRES_DB:-main}",
          "-c",
          "SELECT 1;",
        ]
      interval: 10s
      timeout: 5s
      retries: 3

  # Prometheus PostgreSQL Exporter
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.20.1@sha256:ac5ec343104fae0e2d84a27bb8d69b38430a11910c5382cad85d478d2bab713e
    container_name: postgres-exporter
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: >-
        postgresql://${MONITORING_USER:-monitoring}:${MONITORING_PASSWORD:?MONITORING_PASSWORD not
        set}@postgres:5432/${POSTGRES_DB:-main}?sslmode=disable
      PG_EXPORTER_AUTO_DISCOVER_DATABASES: "true"
      PG_EXPORTER_EXTEND_QUERY_PATH: "/etc/postgres_exporter/queries.yaml"
    volumes:
      - ./prometheus/postgres_exporter_queries.yaml:/etc/postgres_exporter/queries.yaml:ro
    networks:
      - aza-pg-network
    ports:
      - "127.0.0.1:9187:9187"
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M

  # PgBouncer Exporter
  pgbouncer-exporter:
    image: prometheuscommunity/pgbouncer-exporter:v0.12.1@sha256:30f31b6c2efdad3647f8182cc7c1a3a19e42bae5d17387694989f969371c230d
    container_name: pgbouncer-exporter
    restart: unless-stopped
    environment:
      PGBOUNCER_EXPORTER_HOST: pgbouncer
      PGBOUNCER_EXPORTER_PORT: 6432
      PGBOUNCER_EXPORTER_USER: ${POSTGRES_USER:-postgres}
      PGBOUNCER_EXPORTER_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD not set}
      PGBOUNCER_EXPORTER_DATABASE: pgbouncer
    networks:
      - aza-pg-network
    ports:
      - "127.0.0.1:9127:9127"
    depends_on:
      - pgbouncer
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M

  # Prometheus - Metrics Collection
  prometheus:
    image: prom/prometheus:v3.15.0@sha256:efd719c99d83b060d9daefdcf00360461adf279f45ef5391f8d111892118753e
    container_name: prometheus
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
      - "--web.console.libraries=/etc/prometheus/console_libraries"
      - "--web.console.templates=/etc/prometheus/consoles"
      - "--web.enable-lifecycle"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - aza-pg-network
    ports:
      - "127.0.0.1:9090:9090"
    depends_on:
      - postgres-exporter
      - pgbouncer-exporter
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 512M

  # Grafana - Visualization
  grafana:
    image: grafana/grafana:13.2.3@sha256:b28bae15e219c998fb0e0424ed724930cc61b1f61fb404d47c862f9a23f9e572
    container_name: grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD not set}
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://localhost:3000}
      GF_INSTALL_PLUGINS: ""
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    networks:
      - aza-pg-network
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - prometheus
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 512M

networks:
  aza-pg-network:
    external: true
    name: aza-pg-network

volumes:
  postgres_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
