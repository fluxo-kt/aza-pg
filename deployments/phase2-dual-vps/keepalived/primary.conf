# The VIP is the address clients write to, so only a writable primary may hold it. The check fails while
# PostgreSQL is down or is a standby (pg_is_in_recovery() true makes the division fail), and with no weight a
# failing check puts this node in FAULT. So a standby never takes the VIP: promote it first, then it does.
vrrp_script chk_writable_primary {
    script "/usr/bin/docker exec -u postgres postgres psql -X -At -U postgres -d postgres -c 'SELECT 1 / (NOT pg_is_in_recovery())::int'"
    interval 2
    fall 2
    rise 2
}

vrrp_instance VI_1 {
    # BACKUP on both nodes, because keepalived ignores nopreempt on a MASTER. nopreempt keeps the VIP where it
    # is when the old primary comes back: if it returns still writable after a failover, its higher priority
    # would otherwise take the VIP back and clients would write to its stale data.
    state BACKUP
    nopreempt
    interface eth0
    virtual_router_id 51
    priority 100
    advert_int 1

    authentication {
        auth_type PASS
        auth_pass CHANGE_ME_SECURE_VRRP_PASSWORD
    }

    virtual_ipaddress {
        10.0.0.100/24 dev eth0
    }

    track_script {
        chk_writable_primary
    }

    notify_master "/usr/bin/logger 'Keepalived: Transitioned to MASTER'"
    notify_backup "/usr/bin/logger 'Keepalived: Transitioned to BACKUP'"
    notify_fault "/usr/bin/logger 'Keepalived: Entered FAULT state'"
}
