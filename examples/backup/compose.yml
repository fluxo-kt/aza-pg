# pgBackRest for a stack's postgres service (primary or single): continuous WAL archiving, full/diff/incr
# backups and point-in-time restore. Guide and commands: docs/BACKUP-PGBACKREST.md.
#
# pgBackRest runs inside the postgres container, which ships it: archive_command runs there, and pgBackRest reaches
# PostgreSQL through the local socket. A separate pgBackRest container would need SSH or TLS between the two.
# Settings are PGBACKREST_* variables instead of a pgbackrest.conf, so archive_command, `docker compose exec`,
# `docker compose run` and a host cron's `docker exec` all see the same stanza and paths.
#
# From a stack directory: docker compose -f compose.yml -f ../../examples/backup/compose.yml up -d
services:
  postgres:
    environment:
      PGBACKREST_STANZA: main
      PGBACKREST_REPO1_PATH: /backup/pgbackrest
      PGBACKREST_PG1_PATH: /var/lib/postgresql/18/docker # the image's PGDATA
      PGBACKREST_REPO1_RETENTION_FULL: "7"
      PGBACKREST_REPO1_RETENTION_DIFF: "4"
      PGBACKREST_COMPRESS_TYPE: lz4
      PGBACKREST_REPO1_BUNDLE: "y"
      PGBACKREST_REPO1_BLOCK: "y"
    volumes:
      # The primary stack already mounts its backup volume here; this adds it to the single stack. A volume on the
      # same host survives a lost container, not a lost host: add an off-site repository (repo2, e.g. S3) for that.
      - postgres_backup:/backup

volumes:
  postgres_backup:
    name: ${POSTGRES_BACKUP_VOLUME:-postgres_backup}
