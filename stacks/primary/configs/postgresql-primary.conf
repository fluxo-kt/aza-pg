# PostgreSQL Configuration
# Stack: primary
# Generated by scripts/config-generator/generator.ts
#
# DO NOT EDIT MANUALLY - Changes will be overwritten
# Edit scripts/config-generator/base-config.ts and regenerate

# Base Configuration
include = '/etc/postgresql/postgresql-base.conf'

# REPLICATION
synchronous_commit = 'on'
synchronous_standby_names = ''
max_replication_slots = 10
idle_replication_slot_timeout = '48h'
wal_sender_timeout = '60s'

# WAL
max_wal_senders = 10
wal_keep_size = '1GB'
archive_mode = 'off'
archive_command = ''

# PG CRON
cron.log_run = 'on'
cron.log_statement = 'on'

# PGAUDIT
pgaudit.log = 'ddl,write,role'
pgaudit.log_statement_once = 'on'
pgaudit.log_level = 'log'
pgaudit.log_relation = 'on'

# WAL Archiving (disabled by default)
# Uncomment and configure for Point-in-Time Recovery (PITR):
# archive_mode = 'on'
# archive_command = 'cp %p /backup/wal/%f'

# Auto-tuned settings (memory, connections, workers, WAL sizes, wal_level, listen_addresses,
# shared_preload_libraries, ...) are not set here: the entrypoint's values outrank this file.
# Override one with ALTER SYSTEM or -c name=value.
