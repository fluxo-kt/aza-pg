# PostgreSQL Replica Stack
# Streaming replication from primary instance
# Read-only replica for load distribution and high availability

services:
  postgres-replica:
    image: ${POSTGRES_IMAGE:-ghcr.io/fluxo-kt/aza-pg:18}
    container_name: ${COMPOSE_PROJECT_NAME:-aza-pg}-postgres-replica
    restart: unless-stopped

    env_file:
      - .env

    environment:
      # The image uses POSTGRES_BIND_IP as PostgreSQL's listen_addresses. In a stack PostgreSQL must listen on the
      # container's Docker networks, or pgbouncer, the exporters and replicas cannot connect (pg_hba.conf admits only
      # those networks, with passwords). This entry overrides the .env value inside the container only; the host port
      # mapping still reads POSTGRES_BIND_IP from .env, so host exposure stays what the operator chose.
      POSTGRES_BIND_IP: "0.0.0.0"
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}"
      POSTGRES_ROLE: ${POSTGRES_ROLE:-replica}
      PG_REPLICATION_USER: ${PG_REPLICATION_USER:-replicator}
      PG_REPLICATION_PASSWORD: "${PG_REPLICATION_PASSWORD:?PG_REPLICATION_PASSWORD is required}"
      PRIMARY_HOST: ${PRIMARY_HOST:?PRIMARY_HOST is required}
      PRIMARY_PORT: ${PRIMARY_PORT:-5432}
      REPLICATION_SLOT_NAME: ${REPLICATION_SLOT_NAME:-replica_slot_1}
      POSTGRES_WAL_LEVEL: ${POSTGRES_WAL_LEVEL:-replica} # replica level for read-only standby

    ports:
      - "${POSTGRES_BIND_IP:-127.0.0.1}:${POSTGRES_PORT:-5433}:5432"

    volumes:
      - postgres-replica-data:/var/lib/postgresql
      - ./configs/postgresql-replica.conf:/etc/postgresql/postgresql.conf:ro
      - ./configs/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
      - ./configs/pg_ident.conf:/etc/postgresql/pg_ident.conf:ro
      - ./scripts/replica-entrypoint.sh:/usr/local/bin/replica-entrypoint.sh:ro

    # Clones the primary on an empty volume, then runs the image's entrypoint (see the script for why it runs first).
    # Setting entrypoint clears the image's CMD, so command repeats it, with the stack's config and pg_hba.
    entrypoint: ["/usr/local/bin/replica-entrypoint.sh"]
    command: postgres -c config_file=/etc/postgresql/postgresql.conf -c hba_file=/etc/postgresql/pg_hba.conf -c ident_file=/etc/postgresql/pg_ident.conf

    mem_limit: ${POSTGRES_MEMORY_LIMIT:-512m}
    mem_reservation: ${POSTGRES_MEMORY_RESERVATION:-256m}

    cpus: ${POSTGRES_CPU_LIMIT:-0.5}

    networks:
      - postgres_net

    # Explicit healthcheck (uses image's built-in 7-tier healthcheck script)
    healthcheck:
      test: ["CMD", "/usr/local/bin/healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 120s
      # Probe every second until first healthy: services waiting on service_healthy start when PostgreSQL is ready, not at the next 10s tick (Docker Engine 25+).
      start_interval: 1s

  postgres_exporter:
    image: >-
      ${POSTGRES_EXPORTER_IMAGE:-prometheuscommunity/postgres-exporter:v0.20.1@sha256:ac5ec343104fae0e2d84a27bb8d69b38430a11910c5382cad85d478d2bab713e}
    container_name: ${COMPOSE_PROJECT_NAME:-aza-pg}-postgres-exporter-replica
    restart: unless-stopped

    environment:
      DATA_SOURCE_NAME: "postgresql://${POSTGRES_USER:-postgres}@postgres-replica:5432/postgres?sslmode=disable"
      # SECURITY NOTE: PGPASSWORD is visible in docker inspect. This is acceptable for
      # monitoring on private Docker networks. For production, consider Docker secrets.
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      PG_EXPORTER_EXTEND_QUERY_PATH: /etc/postgres_exporter/queries.yaml
      PG_EXPORTER_DISABLE_DEFAULT_METRICS: "false"

    volumes:
      - ../../docker/postgres/configs/postgres_exporter_queries.yaml:/etc/postgres_exporter/queries.yaml:ro

    networks:
      - postgres_net
      - monitoring

    ports:
      - "${POSTGRES_EXPORTER_BIND_IP:-127.0.0.1}:${POSTGRES_EXPORTER_PORT:-9188}:9187"

    mem_limit: ${POSTGRES_EXPORTER_MEMORY_LIMIT:-64m}
    mem_reservation: ${POSTGRES_EXPORTER_MEMORY_RESERVATION:-32m}

    depends_on:
      postgres-replica:
        condition: service_healthy

    healthcheck:
      test:
        - "CMD"
        - "wget"
        - "--quiet"
        - "--tries=1"
        - "--spider"
        - "http://localhost:9187/metrics"
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  postgres_net:
    name: ${POSTGRES_NETWORK_NAME:-postgres-replica-net}
    external: true # Uses network created by primary stack
  monitoring:
    # Services use the key; the variable names the Docker network, so any value works.
    name: ${MONITORING_NETWORK:-monitoring}
    external: true

volumes:
  postgres-replica-data:
    name: ${POSTGRES_DATA_VOLUME:-postgres-replica-data}
    driver: local
