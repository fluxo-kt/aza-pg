# PostgreSQL Configuration
# Stack: replica
# Generated by scripts/config-generator/generator.ts
#
# DO NOT EDIT MANUALLY - Changes will be overwritten
# Edit scripts/config-generator/base-config.ts and regenerate
# The image's entrypoint includes /etc/postgresql/postgresql-base.conf before this file.

# REPLICATION
max_replication_slots = 5
hot_standby = 'on'
max_standby_archive_delay = '300s'
max_standby_streaming_delay = '300s'
hot_standby_feedback = 'on'
wal_receiver_status_interval = '10s'
log_replication_commands = 'on'

# WAL
max_wal_senders = 5

# PGAUDIT
pgaudit.log = 'none'

# AUTO EXPLAIN
auto_explain.log_timing = 'off'

# Auto-tuned settings (memory, connections, workers, WAL sizes, wal_level, listen_addresses,
# shared_preload_libraries, ...) are not set here: the entrypoint's values outrank this file.
# Override one with ALTER SYSTEM or -c name=value.
# Default shared_preload_libraries: auto_explain,pg_cron,pg_net,pg_stat_monitor,pg_stat_statements,pgaudit,pgsodium,safeupdate,supabase_vault,timescaledb